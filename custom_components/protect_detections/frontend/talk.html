<!doctype html>
<!-- Talk window for the camera wall. Browsers only hand out the microphone on
     https, so when the dashboard is open on the plain home-network address
     the card opens this page on the https address instead. The link carries a
     short-lived signed path to the talk websocket (#p=...), so this page needs
     no login of its own. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talk</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #0a0a0a; color: #f3f4f6; font: 15px/1.4 system-ui, sans-serif; display: grid; place-items: center; text-align: center; }
  .dot { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 12px; background: #1f1f1f; display: grid; place-items: center; }
  .dot.on { background: #e0102a; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  svg { width: 26px; height: 26px; fill: #fff; }
  #name { font-weight: 600; }
  #status { color: #9ca3af; font-size: 13px; margin: 2px 0 14px; padding: 0 12px; }
  button { font: inherit; cursor: pointer; border: 1px solid #333; background: #111; color: #fff; border-radius: 999px; padding: 7px 18px; }
</style>
</head>
<body>
<div>
  <div class="dot" id="dot"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3m7 9c0 3.5-2.6 6.4-6 6.9V21h-2v-3.1c-3.4-.5-6-3.4-6-6.9h2a5 5 0 0 0 10 0z"/></svg></div>
  <div id="name"></div>
  <div id="status">Starting…</div>
  <button id="stop">Stop</button>
</div>
<script>
  const q = new URLSearchParams(location.hash.slice(1));
  const path = q.get("p") || "";
  const mime = q.get("m") || "audio/webm;codecs=opus";
  const $ = (id) => document.getElementById(id);
  $("name").textContent = q.get("n") || "Camera";
  document.title = `Talk · ${q.get("n") || "Camera"}`;
  let media, rec, ws, done = false;
  const status = (t) => ($("status").textContent = t);
  function stop(text) {
    done = true;
    $("dot").classList.remove("on");
    try { if (rec && rec.state !== "inactive") rec.stop(); } catch (e) {}
    if (media) media.getTracks().forEach((t) => t.stop());
    try { if (ws) ws.close(); } catch (e) {}
    if (text) { status(text); $("stop").textContent = "Close"; } else window.close();
  }
  $("stop").onclick = () => (done ? window.close() : stop());
  (async () => {
    // only ever talk to this site's own talk endpoint
    if (!path.startsWith("/api/protect_detections/talk/")) return stop("This link isn't valid.");
    try {
      status("Waiting for the microphone…");
      media = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (err) {
      return stop(err && err.name === "NotAllowedError" ? "The microphone is blocked for this site." : "No microphone found.");
    }
    status("Connecting…");
    ws = new WebSocket(`wss://${location.host}${path}`);
    ws.onmessage = (ev) => {
      let msg = {};
      try { msg = JSON.parse(ev.data); } catch (e) {}
      if (msg.error) return stop(msg.error);
      if (!msg.ready || rec) return;
      rec = new MediaRecorder(media, { mimeType: mime, audioBitsPerSecond: 32000 });
      rec.ondataavailable = (e) => { if (e.data.size && ws.readyState === 1) ws.send(e.data); };
      rec.start(60);
      $("dot").classList.add("on");
      status("Talking — close this window to stop.");
    };
    ws.onclose = () => { if (!done) stop(rec ? "Disconnected." : "Couldn't connect. Close this and press Talk again."); };
  })();
</script>
</body>
</html>
